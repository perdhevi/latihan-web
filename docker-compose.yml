# The production image, run locally next to the API from latihanAPI's
# `docker compose up`. It joins that project's network to reach latihan-api,
# and is published on http://localhost:8088:
#
#   docker compose up --build -d --wait
#
# In production the same image is the HTTPS edge in place of the API's own
# Caddy (see docs/part-11.md).

services:
  web:
    build: .
    image: latihan-web:local
    environment:
      SITE_ADDRESS: ":80"
    ports:
      - "127.0.0.1:8088:80"
    networks:
      - latihan
    # As locked down as the API's Caddy in production.
    read_only: true
    tmpfs:
      - /data
      - /config
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

networks:
  latihan:
    name: latihanapi_default
    external: true
